<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- OpenAI-style knot: three overlapping ellipses rotated 0°, 60°, 120° -->
  <g fill="none" stroke="#9d6fd4" stroke-width="7" stroke-linecap="round">
    <!-- Ellipse 1: vertical -->
    <ellipse cx="50" cy="50" rx="14" ry="32" transform="rotate(0 50 50)" />
    <!-- Ellipse 2: rotated 60° -->
    <ellipse cx="50" cy="50" rx="14" ry="32" transform="rotate(60 50 50)" />
    <!-- Ellipse 3: rotated 120° -->
    <ellipse cx="50" cy="50" rx="14" ry="32" transform="rotate(120 50 50)" />
  </g>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="4" fill="#9d6fd4" />
</svg>
