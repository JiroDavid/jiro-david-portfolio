<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="purpleglow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen">
      <rect x="46" y="72" width="108" height="68" rx="2"/>
    </clipPath>
  </defs>

  <circle cx="100" cy="100" r="97" fill="#0f0f1a"/>
  <circle cx="100" cy="100" r="97" fill="url(#purpleglow)"/>
  <circle cx="100" cy="100" r="97" fill="none" stroke="#7c3aed" stroke-width="2.5"/>

  <!-- Monitor body -->
  <rect x="38" y="48" width="124" height="96" rx="8" fill="#1e1b4b" stroke="#7c3aed" stroke-width="2"/>

  <!-- Title bar -->
  <rect x="38" y="48" width="124" height="22" rx="8" fill="#5b21b6"/>
  <rect x="38" y="59" width="124" height="11" fill="#5b21b6"/>

  <!-- Window controls -->
  <circle cx="56" cy="59" r="5" fill="#ff5f57"/>
  <circle cx="72" cy="59" r="5" fill="#febc2e"/>
  <circle cx="88" cy="59" r="5" fill="#28c840"/>

  <!-- Window title -->
  <text x="131" y="63" text-anchor="middle" font-size="7.5" fill="rgba(255,255,255,0.6)" font-family="monospace">jiro.dev</text>

  <!-- Screen -->
  <rect x="46" y="70" width="108" height="70" rx="2" fill="#08001a"/>

  <!-- Scene content clipped to screen -->
  <g clip-path="url(#screen)">
    <rect x="46" y="70" width="108" height="52" fill="#08001a"/>

    <!-- Stars -->
    <circle cx="54" cy="76" r="1" fill="white" opacity="0.9"/>
    <circle cx="67" cy="73" r="1.5" fill="white"/>
    <circle cx="81" cy="77" r="0.8" fill="white" opacity="0.7"/>
    <circle cx="141" cy="75" r="1.5" fill="white" opacity="0.8"/>
    <circle cx="152" cy="79" r="1" fill="white"/>
    <circle cx="134" cy="80" r="0.8" fill="white" opacity="0.6"/>
    <circle cx="118" cy="72" r="1" fill="white" opacity="0.5"/>

    <!-- Crescent moon -->
    <circle cx="145" cy="82" r="9" fill="#fef9c3" opacity="0.9"/>
    <circle cx="149" cy="79" r="6.5" fill="#08001a"/>

    <!-- Ground -->
    <rect x="46" y="120" width="108" height="20" fill="#14532d"/>

    <!-- Tree trunk -->
    <rect x="94" y="102" width="12" height="24" fill="#5c3317"/>

    <!-- Sakura blossoms -->
    <circle cx="100" cy="100" r="17" fill="#f472b6" opacity="0.9"/>
    <circle cx="83" cy="105" r="11" fill="#ec4899" opacity="0.8"/>
    <circle cx="117" cy="105" r="11" fill="#ec4899" opacity="0.8"/>
    <circle cx="100" cy="91" r="9" fill="#fce7f3" opacity="0.75"/>

    <!-- Falling petals -->
    <ellipse cx="61" cy="114" rx="4" ry="2" fill="#fce7f3" opacity="0.8" transform="rotate(-25,61,114)"/>
    <ellipse cx="147" cy="108" rx="3" ry="1.5" fill="#fce7f3" opacity="0.8" transform="rotate(20,147,108)"/>
    <ellipse cx="138" cy="122" rx="3" ry="1.5" fill="#f9a8d4" opacity="0.7" transform="rotate(-10,138,122)"/>
  </g>

  <!-- Monitor stand -->
  <rect x="90" y="144" width="20" height="9" rx="2" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="78" y="152" width="44" height="5" rx="3" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
</svg>
